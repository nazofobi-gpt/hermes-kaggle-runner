name: Build Llama31 70B Q2 Persistent Cache

on:
  push:
    paths:
      - 'control/llama70_cache.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-llama70-cache
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USER: nazofobigpt
      DATASET_ID: nazofobigpt/hermes-llama31-70b-q2-cache
      BASE_MODEL: llama3.1:70b-instruct-q2_K
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN missing'; exit 3; }

      - name: Install Kaggle CLI
        run: python3 -m pip install -q --upgrade kaggle

      - name: Check existing cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          if kaggle datasets status "$DATASET_ID" >/tmp/cache-status.txt 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            cat /tmp/cache-status.txt
            echo 'LLAMA70_CACHE_DATASET=EXISTS'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'LLAMA70_CACHE_DATASET=MISSING'
          fi

      - name: Reclaim runner disk
        if: steps.cache.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'DISK_BEFORE'
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo 'DISK_AFTER'
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$free_gb" -lt 34 ]; then
            echo "LLAMA70_DISK_PREFLIGHT=FAIL free_gb=$free_gb"
            exit 4
          fi
          echo "LLAMA70_DISK_PREFLIGHT=PASS free_gb=$free_gb"

      - name: Install Ollama
        if: steps.cache.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Download Llama70 once
        if: steps.cache.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_HOST=127.0.0.1:11503
          export OLLAMA_MODELS="$RUNNER_TEMP/llama70-models"
          mkdir -p "$OLLAMA_MODELS"
          ollama serve >"$RUNNER_TEMP/llama70-cache-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull "$BASE_MODEL"
          ollama show "$BASE_MODEL" >/dev/null
          echo 'LLAMA70_CACHE_DOWNLOAD_ONCE=PASS'
          du -sh "$OLLAMA_MODELS"
          df -h /

      - name: Prepare private cache dataset
        if: steps.cache.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/llama70-models"
          src_manifest="$OLLAMA_MODELS/manifests/registry.ollama.ai/library/llama3.1/70b-instruct-q2_K"
          test -f "$src_manifest"
          shopt -s nullglob
          blobs=("$OLLAMA_MODELS"/blobs/sha256-*)
          test "${#blobs[@]}" -gt 0

          dataset_dir="$RUNNER_TEMP/hermes-llama31-70b-q2-cache"
          mkdir -p "$dataset_dir"
          cp "$src_manifest" "$dataset_dir/base-manifest.json"
          for src in "${blobs[@]}"; do
            dst="$dataset_dir/$(basename "$src")"
            ln "$src" "$dst" 2>/dev/null || cp --reflink=auto "$src" "$dst"
          done

          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hermes-llama31-70b-q2-cache'
          metadata = {
              'title': 'Hermes Llama 3.1 70B Q2 Ollama Cache',
              'id': os.environ['DATASET_ID'],
              'licenses': [{'name': 'other'}],
              'description': 'Private persistent Ollama cache for llama3.1:70b-instruct-q2_K acceptance testing.',
          }
          (root / 'dataset-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          index = {
              'base_model': os.environ['BASE_MODEL'],
              'blob_count': len(list(root.glob('sha256-*'))),
          }
          (root / 'cache-index.json').write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')
          PY

          echo "LLAMA70_CACHE_BLOBS=${#blobs[@]}"
          du -sh "$dataset_dir"
          df -h /

      - name: Create private Kaggle dataset
        if: steps.cache.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets create -p "$RUNNER_TEMP/hermes-llama31-70b-q2-cache" -q
          echo 'LLAMA70_CACHE_DATASET_CREATE=PASS'

      - name: Verify persistent cache
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if kaggle datasets status "$DATASET_ID" >/tmp/final-status.txt 2>&1; then
              cat /tmp/final-status.txt
              echo 'LLAMA70_CACHE_PERSISTENCE=PASS'
              exit 0
            fi
            sleep 5
          done
          cat /tmp/final-status.txt || true
          echo 'LLAMA70_CACHE_PERSISTENCE=FAIL'
          exit 5
