name: Kaggle GPU Control

on:
  push:
    paths:
      - 'control/kaggle_state.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-control
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read desired state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          desired=$(jq -r '.desired' control/kaggle_state.json)
          generation=$(jq -r '.generation' control/kaggle_state.json)
          case "$desired" in RUN|STOP) ;; *) echo "Invalid desired state: $desired"; exit 2 ;; esac
          [[ "$generation" =~ ^[0-9]+$ ]] || { echo 'generation must be an integer'; exit 2; }
          echo "desired=$desired" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "KAGGLE_DESIRED_STATE=$desired"
          echo "KAGGLE_GENERATION=$generation"

      - name: Stop signal accepted
        if: steps.state.outputs.desired == 'STOP'
        shell: bash
        run: |
          echo 'KAGGLE_STOP_SIGNAL: PASS'
          echo 'A running worker polls the public control state and will terminate itself.'

      - name: Verify Kaggle credential
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo 'KAGGLE_API_TOKEN missing from GitHub Actions secrets.'
            exit 3
          }
          echo 'KAGGLE_API_TOKEN: configured'

      - name: Install Kaggle CLI
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        run: |
          python3 -m pip install -q --upgrade kaggle kagglehub
          kaggle --version

      - name: Resolve Kaggle account and prepare private worker kernel
        if: steps.state.outputs.desired == 'RUN'
        id: kernel
        shell: bash
        env:
          GENERATION: ${{ steps.state.outputs.generation }}
        run: |
          set -euo pipefail
          KAGGLE_USER=$(python3 - <<'PY'
          import kagglehub
          info = kagglehub.whoami()
          username = info.get('username') if isinstance(info, dict) else None
          if not username:
              raise SystemExit('Unable to resolve Kaggle username from token')
          print(username)
          PY
          )
          echo "user=$KAGGLE_USER" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('kaggle')
          root.mkdir(exist_ok=True)
          username = os.environ['KAGGLE_USER']
          generation = int(os.environ['GENERATION'])
          (root / 'runtime_config.json').write_text(json.dumps({
              'generation': generation,
              'max_runtime_seconds': 21600,
          }, indent=2) + '\n', encoding='utf-8')
          (root / 'kernel-metadata.json').write_text(json.dumps({
              'id': f'{username}/hermes-gpu-worker',
              'title': 'Hermes GPU Worker',
              'code_file': 'worker.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [],
              'competition_sources': [],
              'kernel_sources': [],
              'model_sources': [],
          }, indent=2) + '\n', encoding='utf-8')
          PY
        env:
          KAGGLE_USER: ${{ steps.kernel.outputs.user }}

      - name: Launch Kaggle T4 worker
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        env:
          KAGGLE_USER: ${{ steps.kernel.outputs.user }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle --accelerator NvidiaTeslaT4
          echo 'KAGGLE_KERNEL_PUSH: PASS'
          sleep 5
          kaggle kernels status "$KAGGLE_USER/hermes-gpu-worker" || true
