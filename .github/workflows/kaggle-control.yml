name: Kaggle GPU Control

on:
  push:
    paths:
      - 'control/kaggle_state.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-control
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          desired=$(jq -r '.desired' control/kaggle_state.json)
          generation=$(jq -r '.generation' control/kaggle_state.json)
          case "$desired" in RUN|STOP) ;; *) exit 2 ;; esac
          [[ "$generation" =~ ^[0-9]+$ ]] || exit 2
          echo "desired=$desired" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Accept stop
        if: steps.state.outputs.desired == 'STOP'
        run: echo 'KAGGLE_STOP_SIGNAL=PASS'

      - name: Verify credential
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        run: |
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN missing'; exit 3; }

      - name: Install Kaggle tools
        if: steps.state.outputs.desired == 'RUN'
        run: python3 -m pip install -q --upgrade kaggle kagglehub

      - name: Prepare private cached-model kernel
        if: steps.state.outputs.desired == 'RUN'
        id: kernel
        shell: bash
        env:
          GENERATION: ${{ steps.state.outputs.generation }}
        run: |
          set -euo pipefail
          user=$(python3 - <<'PY'
          import kagglehub
          info = kagglehub.whoami()
          print(info['username'])
          PY
          )
          echo "user=$user" >> "$GITHUB_OUTPUT"
          export KAGGLE_USER="$user"

          kaggle datasets status "$KAGGLE_USER/hermes-ollama-cache" >/tmp/model-cache-status.txt
          cat /tmp/model-cache-status.txt
          echo 'MODEL_CACHE_DATASET_PREFLIGHT=PASS'

          api_key=$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )
          echo "::add-mask::$api_key"
          export PROXY_API_KEY="$api_key"
          echo "PROXY_API_KEY=$api_key" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('kaggle')
          cfg = {
              'generation': int(os.environ['GENERATION']),
              'source_ref': os.environ['GITHUB_SHA'],
              'max_runtime_seconds': 21600,
              'startup_grace_seconds': 120,
              'idle_timeout_seconds': 300,
          }

          entry = root / 'cached_entry.py'
          text = entry.read_text(encoding='utf-8')
          config_marker = 'EMBEDDED_RUNTIME_CONFIG = None'
          key_marker = 'EMBEDDED_PROXY_API_KEY = None'
          if text.count(config_marker) != 1 or text.count(key_marker) != 1:
              raise SystemExit('bootstrap placeholder missing or duplicated')
          text = text.replace(config_marker, 'EMBEDDED_RUNTIME_CONFIG = ' + repr(cfg))
          text = text.replace(key_marker, 'EMBEDDED_PROXY_API_KEY = ' + repr(os.environ['PROXY_API_KEY']))
          entry.write_text(text, encoding='utf-8')

          (root / 'kernel-metadata.json').write_text(json.dumps({
              'id': f"{os.environ['KAGGLE_USER']}/hermes-gpu-worker",
              'title': 'Hermes GPU Worker',
              'code_file': 'cached_entry.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [f"{os.environ['KAGGLE_USER']}/hermes-ollama-cache"],
              'competition_sources': [],
              'kernel_sources': [],
              'model_sources': [],
          }, indent=2) + '\n')
          PY
          echo 'KAGGLE_EPHEMERAL_AUTH_EMBED=PASS'

      - name: Start Kaggle T4 worker
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        env:
          KAGGLE_USER: ${{ steps.kernel.outputs.user }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle --accelerator NvidiaTeslaT4
          echo 'KAGGLE_KERNEL_PUSH=PASS'
          sleep 5
          kaggle kernels status "$KAGGLE_USER/hermes-gpu-worker" || true

      - name: Wait for private worker endpoint
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        env:
          KAGGLE_USER: ${{ steps.kernel.outputs.user }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/kaggle-worker.log"
          : > "$log_file"
          timeout 480s kaggle kernels logs "$KAGGLE_USER/hermes-gpu-worker" --follow >"$log_file" 2>&1 &
          log_pid=$!

          ready=0
          for _ in $(seq 1 96); do
            if grep -q 'KAGGLE_GPU_WORKER: READY' "$log_file" && grep -q 'KAGGLE_TUNNEL_URL=' "$log_file"; then
              ready=1
              break
            fi
            status=$(kaggle kernels status "$KAGGLE_USER/hermes-gpu-worker" 2>&1 || true)
            if grep -Eq 'ERROR|COMPLETE|CANCEL' <<<"$status"; then
              echo "KAGGLE_WORKER_READY=FAIL status=$status"
              tail -n 80 "$log_file" | sed -E 's#https://[a-z0-9-]+\.trycloudflare\.com#[TUNNEL_URL_REDACTED]#g'
              kill "$log_pid" 2>/dev/null || true
              wait "$log_pid" 2>/dev/null || true
              exit 4
            fi
            sleep 5
          done

          kill "$log_pid" 2>/dev/null || true
          wait "$log_pid" 2>/dev/null || true
          [[ "$ready" == "1" ]] || { echo 'KAGGLE_WORKER_READY=TIMEOUT'; exit 5; }

          tunnel_url=$(grep -oE 'KAGGLE_TUNNEL_URL=https://[a-z0-9-]+\.trycloudflare\.com' "$log_file" | tail -1 | cut -d= -f2-)
          test -n "$tunnel_url" || { echo 'KAGGLE_TUNNEL_DISCOVERY=FAIL'; exit 6; }
          echo "::add-mask::$tunnel_url"
          echo "KAGGLE_TUNNEL_URL=$tunnel_url" >> "$GITHUB_ENV"
          echo 'KAGGLE_WORKER_READY=PASS'
          echo 'KAGGLE_TUNNEL_DISCOVERY=PASS'

      - name: Automation backend acceptance
        if: steps.state.outputs.desired == 'RUN'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_TUNNEL_URL:-}" || exit 7
          test -n "${PROXY_API_KEY:-}" || exit 7

          code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}'             --connect-timeout 15 --max-time 45             -H "Authorization: Bearer $PROXY_API_KEY"             "$KAGGLE_TUNNEL_URL/health" || true)
          [[ "$code" == "200" ]] || { echo "GPU_BACKEND_HEALTH=FAIL http=$code"; exit 8; }
          jq -e '.ok == true' "$RUNNER_TEMP/health.json" >/dev/null
          echo 'GPU_BACKEND_HEALTH=PASS'

          token="GPU_AUTOMATION_E2E_PASS"
          code=$(curl -sS -o "$RUNNER_TEMP/chat.json" -w '%{http_code}'             --connect-timeout 15 --max-time 360             -H "Authorization: Bearer $PROXY_API_KEY"             -H 'Content-Type: application/json'             -d "$(jq -nc --arg token "$token" '{model:"llama3.1-hermes",messages:[{role:"user",content:("Reply exactly " + $token)}],temperature:0,stream:false}')"             "$KAGGLE_TUNNEL_URL/v1/chat/completions" || true)
          [[ "$code" == "200" ]] || { echo "GPU_BACKEND_INFERENCE=FAIL http=$code"; exit 9; }
          content=$(jq -r '.choices[0].message.content // ""' "$RUNNER_TEMP/chat.json")
          grep -Fq "$token" <<<"$content" || { echo 'GPU_BACKEND_INFERENCE=FAIL token-mismatch'; exit 10; }
          echo 'GPU_BACKEND_INFERENCE=PASS'
          echo 'GPU_AUTOMATION_BACKEND=PASS'
