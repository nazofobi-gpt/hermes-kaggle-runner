name: Kaggle Worker Status Probe

on:
  push:
    paths:
      - 'control/kaggle_status_probe.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: nazofobigpt/hermes-gpu-worker
    steps:
      - name: Check worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN missing'; exit 2; }
          python3 -m pip install -q --upgrade kaggle

          status=$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)
          echo "$status"

          live_log="$RUNNER_TEMP/live-kernel.log"
          kaggle kernels logs "$KERNEL_ID" >"$live_log" 2>&1 || true
          grep -E 'CONTROL_STOP_OR_REPLACED|GPU_IDLE_TIMEOUT_REACHED|KAGGLE_GPU_WORKER: READY|KAGGLE_GPU_WORKER_FATAL|MAX_RUNTIME_REACHED' "$live_log"             | tail -n 20             | sed -E 's#https://[a-z0-9-]+\.trycloudflare\.com#[TUNNEL_URL_REDACTED]#g' || true

          if grep -q 'RUNNING' <<<"$status"; then
            echo 'KAGGLE_WORKER_STATUS=RUNNING'
            exit 0
          fi
          if grep -q 'QUEUED' <<<"$status"; then
            echo 'KAGGLE_WORKER_STATUS=QUEUED'
            exit 0
          fi
          if grep -Eq 'ERROR|COMPLETE|CANCEL' <<<"$status"; then
            echo 'KAGGLE_WORKER_STATUS=TERMINAL'
            exit 0
          fi
          echo 'KAGGLE_WORKER_STATUS=UNKNOWN'
          exit 4
