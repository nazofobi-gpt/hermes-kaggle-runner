name: Bootstrap GPU Transport Key

on:
  push:
    paths:
      - 'control/gpu_transport_bootstrap.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpu-transport-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USER: nazofobigpt
      DATASET_ID: nazofobigpt/hermes-gpu-transport-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kaggle credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN missing'; exit 2; }

      - name: Install tools
        run: python3 -m pip install -q --upgrade kaggle pynacl

      - name: Ensure private transport key dataset
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/hermes-gpu-transport-key"
          mkdir -p "$key_dir"

          if kaggle datasets status "$DATASET_ID" >/tmp/key-status.txt 2>&1; then
            echo 'GPU_TRANSPORT_KEY_DATASET=EXISTS'
            kaggle datasets download "$DATASET_ID" -f public_key.b64 -p "$key_dir" --unzip -o -q
            test -s "$key_dir/public_key.b64"
          else
            python3 - <<'PY'
          import base64, json, os, pathlib
          from nacl.public import PrivateKey

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hermes-gpu-transport-key"
          root.mkdir(parents=True, exist_ok=True)
          private_key = PrivateKey.generate()
          private_b64 = base64.b64encode(bytes(private_key)).decode("ascii")
          public_b64 = base64.b64encode(bytes(private_key.public_key)).decode("ascii")
          (root / "private_key.b64").write_text(private_b64 + "\n", encoding="utf-8")
          (root / "public_key.b64").write_text(public_b64 + "\n", encoding="utf-8")
          metadata = {
              "title": "Hermes GPU Transport Key",
              "id": os.environ["DATASET_ID"],
              "licenses": [{"name": "other"}],
              "description": "Private key material for encrypted one-shot automation tasks. Never publish this dataset.",
          }
          (root / "dataset-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY
            chmod 600 "$key_dir/private_key.b64"
            kaggle datasets create -p "$key_dir" -q
            echo 'GPU_TRANSPORT_KEY_DATASET=CREATED'

            for _ in $(seq 1 30); do
              if kaggle datasets status "$DATASET_ID" >/tmp/key-final-status.txt 2>&1; then
                break
              fi
              sleep 2
            done
            kaggle datasets status "$DATASET_ID"
          fi

          echo 'GPU_TRANSPORT_KEY_PRIVATE_DATASET=PASS'

      - name: Publish public encryption key
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/hermes-gpu-transport-key"
          test -s "$key_dir/public_key.b64"
          cp "$key_dir/public_key.b64" control/gpu_transport_public_key.b64

          if git diff --quiet -- control/gpu_transport_public_key.b64 && git ls-files --error-unmatch control/gpu_transport_public_key.b64 >/dev/null 2>&1; then
            echo 'GPU_TRANSPORT_PUBLIC_KEY=UNCHANGED'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/gpu_transport_public_key.b64
          git commit -m "Publish GPU transport public key"
          git push
          echo 'GPU_TRANSPORT_PUBLIC_KEY=PUBLISHED'
