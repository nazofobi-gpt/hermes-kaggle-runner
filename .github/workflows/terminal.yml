name: Remote Terminal

on:
  push:
    paths:
      - 'commands/run.sh'
      - 'scripts/g003_pg_connection_probe.py'
      - '.github/workflows/terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run command script
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          chmod +x commands/run.sh
          ./commands/run.sh
